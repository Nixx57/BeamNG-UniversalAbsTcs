<div class="bngApp">
    <div>
        <button title="Reset to default" ng-click="reset()">Reset to default</button>
    </div>

    <div>
        <div>
            <span>Minimum Speed (m/s):</span>
            <input type="number" min="0" step="0.5" ng-model="lowSpeedReference" required>
        </div>

        <div>
            <label><input type="checkbox" ng-model="bCustomTolerance" ng-change="toggleCustomTolerance()" aria-label="Custom Tolerance">Custom Tolerance</label>
            <input type="number" min="0" step="1.0" ng-model="tolerance" ng-disabled="!bCustomTolerance" required>
        </div>
        <div>
            <span>Coefficient increase divisor:</span>
            <input type="number" min="0.01" step="0.1" ng-model="increaseDivisor" required>
        </div>
        <div>
            <span>Coefficient decrease multiplier:</span>
            <input type="number" min="0" step="0.1" ng-model="decreaseMultiplier" required>
        </div>
    </div>
  <button title="Apply" ng-click="apply()">Apply</button>
</div>

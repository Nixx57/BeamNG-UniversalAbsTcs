<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="254"
   height="200"
   viewBox="0 0 254 200"
   version="1.1"
   id="svg_uat">
  <style id="style_uat">
    @font-face {
      font-family: Digital;
      src: url(/ui/common/Segment7Standard.otf);
    }
    .uat-btn-bg {
      fill: #434343;
      stroke: #000000;
      stroke-width: 1.2px;
      cursor: pointer;
      transition: fill 0.15s ease;
    }
    .uat-btn-bg:hover {
      fill: #525252;
    }
    .uat-btn-bg:active {
      fill: #333333;
    }
    .uat-arrow-btn {
      fill: #434343;
      stroke: #000000;
      stroke-width: 1.2px;
      cursor: pointer;
      transition: fill 0.15s ease;
    }
    .uat-arrow-btn:hover {
      fill: #FF6600;
    }
    .uat-arrow-btn:active {
      fill: #D55200;
    }
    .uat-text-active {
      fill: #FF6600;
      transition: fill 0.15s ease;
    }
    .uat-text-inactive {
      fill: #949494;
      transition: fill 0.15s ease;
    }
    .uat-led-active {
      fill: #FF6600;
      transition: fill 0.15s ease;
    }
    .uat-led-inactive {
      fill: #222222;
      transition: fill 0.15s ease;
    }
  </style>

  <!-- Mode LCD & Arrow Selectors -->
  <g id="mode_section">
    <!-- Left Arrow Button -->
    <g id="prev_mode_btn" ng-click="toggleMode()" style="cursor: pointer">
      <path
         d="M 40,36 L 14,60 L 40,84 Z"
         class="uat-arrow-btn"
         id="left_arrow_path" />
    </g>

    <!-- LCD Screen Display -->
    <g id="lcd_screen">
      <rect
         x="48"
         y="16"
         width="158"
         height="88"
         rx="8"
         ry="8"
         fill="#151515"
         stroke="#000000"
         stroke-width="1.5"
         id="lcd_outer_rect" />
      <rect
         x="51"
         y="19"
         width="152"
         height="82"
         rx="6"
         ry="6"
         fill="#1e1e1e"
         stroke="#2d2d2d"
         stroke-width="1"
         id="lcd_inner_rect" />

      <!-- LCD Label "MODE" -->
      <text
         x="127"
         y="38"
         text-anchor="middle"
         font-family="Roboto, sans-serif"
         font-size="12px"
         font-weight="bold"
         fill="#777777"
         letter-spacing="2"
         id="lcd_label_text">MODE</text>

      <!-- Mode Name Display (PERFORMANCE / GRIP) -->
      <text
         x="127"
         y="76"
         text-anchor="middle"
         font-family="Roboto, sans-serif"
         font-size="19px"
         font-weight="900"
         fill="#FF6600"
         letter-spacing="1"
         id="lcd_mode_text">{{ (mode || 'PERFORMANCE') | uppercase }}</text>
    </g>

    <!-- Right Arrow Button -->
    <g id="next_mode_btn" ng-click="toggleMode()" style="cursor: pointer">
      <path
         d="M 214,36 L 240,60 L 214,84 Z"
         class="uat-arrow-btn"
         id="right_arrow_path" />
    </g>
  </g>

  <!-- ABS Button -->
  <g id="abs_btn" ng-click="toggleAbs()" style="cursor: pointer">
    <rect
       x="14"
       y="116"
       width="108"
       height="72"
       rx="8"
       ry="8"
       class="uat-btn-bg"
       id="abs_btn_bg" />
    <!-- LED Status Bar -->
    <rect
       x="24"
       y="124"
       width="88"
       height="5"
       rx="2"
       ry="2"
       ng-class="absEnabled ? 'uat-led-active' : 'uat-led-inactive'"
       id="abs_led_bar" />
    <!-- ABS Text -->
    <text
       x="68"
       y="167"
       text-anchor="middle"
       font-family="Roboto, sans-serif"
       font-size="32px"
       font-weight="900"
       ng-class="absEnabled ? 'uat-text-active' : 'uat-text-inactive'"
       id="abs_btn_txt">ABS</text>
  </g>

  <!-- TCS Button -->
  <g id="tcs_btn" ng-click="toggleTcs()" style="cursor: pointer">
    <rect
       x="132"
       y="116"
       width="108"
       height="72"
       rx="8"
       ry="8"
       class="uat-btn-bg"
       id="tcs_btn_bg" />
    <!-- LED Status Bar -->
    <rect
       x="142"
       y="124"
       width="88"
       height="5"
       rx="2"
       ry="2"
       ng-class="tcsEnabled ? 'uat-led-active' : 'uat-led-inactive'"
       id="tcs_led_bar" />
    <!-- TCS Text -->
    <text
       x="186"
       y="167"
       text-anchor="middle"
       font-family="Roboto, sans-serif"
       font-size="32px"
       font-weight="900"
       ng-class="tcsEnabled ? 'uat-text-active' : 'uat-text-inactive'"
       id="tcs_btn_txt">TCS</text>
  </g>
</svg>
       y="196"
       text-anchor="middle"
       font-family="Roboto, sans-serif"
       font-size="38px"
       font-weight="900"
       ng-class="absEnabled ? 'uat-text-active' : 'uat-text-inactive'"
       id="abs_btn_txt">ABS</text>
  </g>

  <!-- TCS Button -->
  <g id="tcs_btn" ng-click="toggleTcs()" style="cursor: pointer">
    <rect
       x="132"
       y="120"
       width="108"
       height="124"
       rx="10"
       ry="10"
       class="uat-btn-bg"
       id="tcs_btn_bg" />
    <!-- LED Status Bar -->
    <rect
       x="142"
       y="132"
       width="88"
       height="5"
       rx="2"
       ry="2"
       ng-class="tcsEnabled ? 'uat-led-active' : 'uat-led-inactive'"
       id="tcs_led_bar" />
    <!-- TCS Text -->
    <text
       x="186"
       y="196"
       text-anchor="middle"
       font-family="Roboto, sans-serif"
       font-size="38px"
       font-weight="900"
       ng-class="tcsEnabled ? 'uat-text-active' : 'uat-text-inactive'"
       id="tcs_btn_txt">TCS</text>
  </g>
</svg>
